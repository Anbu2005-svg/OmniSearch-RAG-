services:
  - type: web
    name: omnisearch-rag-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: OPTIMIZE_RAM
        value: true
      - key: LLM_PROVIDER
        value: ollama
      - key: MODEL_NAME
        value: llama3
